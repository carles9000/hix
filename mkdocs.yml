site_name: HIX Web Server
site_url: https://carles9000.github.io/hix/
docs_dir: site-docs
site_description: Documentación del servidor web HIX para Harbour
site_author: Charly Nou mil


theme:
  name: material
  custom_dir: site-docs/overrides
  language: en
  font: false
  logo: assets/hix_white.png
  favicon: assets/hix.ico
  palette:
    - scheme: default
      primary: custom        # Color principal (header, sidebar activo)
      accent: custom           # Color de énfasis (links hover, botones)		
      toggle:
        #icon: material/weather-sunny 
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        #icon: material/weather-night
        icon: material/brightness-4
        name: Modo claro
  features:
    # --- SIDEBAR ---
    #- navigation.sections        # Muestra secciones como grupos colapsables
    #- navigation.expand          # Expande todos los items por defecto
    #- navigation.indexes         # Permite que una sección tenga su propia página index
    - navigation.top             # Botón "volver arriba"
    # --- COMPORTAMIENTO ---
    - navigation.instant           # Navegación SPA sin recarga de página
    - navigation.instant.progress  # Barra de progreso en carga lenta
    - navigation.tracking          # Actualiza la URL con el anchor activo

    # --- TABLA DE CONTENIDOS ---
    - toc.follow                 # El TOC derecho sigue el scroll
    #- toc.integrate              # Integra el TOC dentro del sidebar izquierdo

    # --- BÚSQUEDA ---
    - search.highlight
    - search.suggest

    # --- CÓDIGO ---
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search:
      lang: es
  - i18n:
      docs_structure: folder        # carpetas /es /en /ca ...
      fallback_to_default: true     # si falta traducción, usa el idioma por defecto
      reconfigure_material: true    # activa el selector de idioma en el header
      reconfigure_search: true      # búsqueda separada por idioma
      languages:
        - locale: es
          name: Español
          default: false             # idioma principal
          build: true
          site_name: "Web Server"
          nav:
            - Inicio: es/index.md
            - Introducción:
                - Bienvenido a HIX: es/intro/intro.md
                - Modo Básico: es/intro/modo-basico.md
                - Modo HIX Style: es/intro/hixstyle.md
                - Hoja de ruta: es/intro/data-driven.md
            - Primeros pasos:
                - Compila proyecto: es/primeros-pasos/compile.md               
