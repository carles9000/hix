            - Programacion:
                - Helpers: es/programacion/mapa-helpers.md
                - Modo Dev / Modo Prod: es/programacion/modo-dev-prod.md
                - Errorsys: es/programacion/errorsys.md
                - Error Handling: es/programacion/error-handling.md
                - Error Code: es/programacion/error_codes.md
            - HIX Style:
                - Rutas: es/hixstyle/routes/routes.md
                - Middleware:
                    - Introducción: es/hixstyle/middleware/middleware.md
                    - Contexto: es/hixstyle/middleware/contexto.md
                    - Diseño: es/hixstyle/middleware/mw_dessign.md
                    - Catálogo: es/hixstyle/middleware/mw_list.md
