@args cName = '', hUser = {=>}, cRoles = ''
<!DOCTYPE html>
<html lang="en">
<head>

	@view 'common/header.html' 
   
   <link href='/public/css/main.css' rel='stylesheet'>
   
</head>

<body>

	<!-- Navbar -->	
	
	@view 'common/navbar.html'


  <!--
   <div class='contenedor'>
     <img src='/public/images/logo.png'/>     
     <span class='title'>Welcome, {{ cName }} ! </span>
   </div><hr>   
   -->
  
   <main class="container-fluid mycontainer pb-5 mb-4">

      <!-- Tabs: System / MySQL / Dbf -->

      <ul class="nav nav-tabs mt-2" id="mainTabs" role="tablist">
         <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-system-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-system" type="button" role="tab"
                    aria-controls="tab-system" aria-selected="true">
               <i class="bi bi-cpu me-1"></i>System
            </button>
         </li>
         <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-mysql-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-mysql" type="button" role="tab"
                    aria-controls="tab-mysql" aria-selected="false">
               <i class="bi bi-database me-1"></i>MySQL
            </button>
         </li>
         <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-dbf-btn" data-bs-toggle="tab"
                    data-bs-target="#tab-dbf" type="button" role="tab"
                    aria-controls="tab-dbf" aria-selected="false">
               <i class="bi bi-table me-1"></i>Dbf
            </button>
         </li>
      </ul>

      <div class="tab-content pt-3" id="mainTabsContent">

         <!-- System tab -->
         <div class="tab-pane fade show active" id="tab-system" role="tabpanel"
              aria-labelledby="tab-system-btn">
            <div class="row row-cols-2 g-3">
               <div class="col">
                  <a href="/server-info" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-speedometer2 fs-3 d-block mb-1"></i>Server
                  </a>
               </div>
               <div class="col">
                  <a href="/http-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-arrow-left-right fs-3 d-block mb-1"></i>HTTP Test
                  </a>
               </div>
               <div class="col">
                  <a href="/ws-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-hdd-network fs-3 d-block mb-1"></i>WS Test
                  </a>
               </div>
               <div class="col">
                  <a href="/stress-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-lightning-charge fs-3 d-block mb-1"></i>Stress Test
                  </a>
               </div>
               <div class="col">
                  <a href="/file-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-file-earmark-arrow-up fs-3 d-block mb-1"></i>File Test
                  </a>
               </div>
               <div class="col">
                  <a href="/sse-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-broadcast fs-3 d-block mb-1"></i>SSE Test
                  </a>
               </div>
               <div class="col">
                  <a href="/job-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-list-check fs-3 d-block mb-1"></i>SSE Long Job
                  </a>
               </div>
            </div>
         </div>

         <!-- Dbf tab -->
         <div class="tab-pane fade" id="tab-dbf" role="tabpanel"
              aria-labelledby="tab-dbf-btn">
            <div class="row row-cols-2 g-3">
               <div class="col">
                  <a href="/users" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-people fs-3 d-block mb-1"></i>Users
                  </a>
               </div>
               <div class="col">
                  <a href="/message" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-chat-dots fs-3 d-block mb-1"></i>Message
                  </a>
               </div>
               <div class="col">
                  <a href="/blog" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-pencil-square fs-3 d-block mb-1"></i>Blog example
                  </a>
               </div>
               <div class="col">
                  <a href="/your-module" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-mortarboard fs-3 d-block mb-1"></i>Your module
                  </a>
               </div>
            </div>
         </div>

         <!-- MySQL tab -->
         <div class="tab-pane fade" id="tab-mysql" role="tabpanel"
              aria-labelledby="tab-mysql-btn">
            <div id="mysql-not-configured" class="alert alert-warning mt-2" style="display:none">
               <i class="bi bi-exclamation-triangle-fill me-2"></i>
               MySQL configuration pending, read <strong>readme.md</strong>
            </div>
            <div id="mysql-modules" class="row row-cols-2 g-3" style="display:none">
               <div class="col">
                  <a href="/mysql-test" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-database fs-3 d-block mb-1"></i>MySQL Test
                  </a>
               </div>
               <div class="col">
                  <a href="/bench" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-speedometer fs-3 d-block mb-1"></i>DB Bench
                  </a>
               </div>
               <div class="col">
                  <a href="/mysql-demo" class="btn btn-outline-dark w-100 btn-tile">
                     <i class="bi bi-lightning-charge fs-3 d-block mb-1"></i>MySQL Showcase
                  </a>
               </div>
            </div>
         </div>

      </div>

   </main>

	<script>
	   // Activate tab from URL hash (e.g. /main#mysql -> MySQL tab)
	   (function () {
	      const hash = (location.hash || '').replace('#', '');
	      if (!hash) return;
	      const btn = document.getElementById('tab-' + hash + '-btn');
	      if (btn) new bootstrap.Tab(btn).show();
	   })();

	   // MySQL tab: check pool registration before showing modules
	   (function () {
	      let checked = false;
	      function checkMysql() {
	         if (checked) return;
	         checked = true;
	         fetch('/api/mysql-pool-stats')
	            .then(r => r.json())
	            .then(data => {
	               if (data.registered) {
	                  document.getElementById('mysql-modules').style.display = '';
	               } else {
	                  document.getElementById('mysql-not-configured').style.display = 'block';
	               }
	            })
	            .catch(function () {
	               document.getElementById('mysql-not-configured').style.display = 'block';
	            });
	      }
	      document.getElementById('tab-mysql-btn').addEventListener('show.bs.tab', checkMysql);
	      if (document.getElementById('tab-mysql-btn').classList.contains('active')) checkMysql();
	   })();
	</script>

	<!-- Bottom nav -->

	<nav class="navbar navbar-dark bg-dark fixed-bottom p-0">
		<div class="d-flex w-100" role="group" aria-label="Bottom navigation">
			<a href="/" class="btn btn-dark rounded-0 py-2 w-25 flex-grow-0 flex-shrink-0">
				<i class="bi bi-house"></i><span class="btn-lbl">Home</span>
			</a>
		</div>
	</nav>

</body>

</html>
